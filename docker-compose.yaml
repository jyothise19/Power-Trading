services:
  powertrading:
    build: .
    container_name: flask-app
    ports:
      - "5000:5000"
    depends_on:
      - mysql-db
    environment:
      DB_HOST: mysql-db
      DB_USER: powertrading_user
      DB_PASSWORD: jyothi
      DB_NAME: power_db
    volumes:
      - .:/app
    restart: always

  mysql-db:
    image: mysql:8.0
    container_name: mysql_powertrading
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: jyothi
      MYSQL_DATABASE: power_db
      MYSQL_USER: root
      MYSQL_PASSWORD: jyothi
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
